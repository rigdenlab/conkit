name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  unittests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package and test dependencies
      # Editable install builds the Cython extensions in place, next to the
      # sources that pytest imports (see addopts in pyproject.toml).
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . pytest pytest-cov
    - name: Run tests
      run: python -m pytest
    - name: Upload coverage to Codecov
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && github.event_name == 'push' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
